services:
  cfb-forecast:
    user: "${CFB_UID:-10001}:${CFB_GID:-10001}"
    image: ${CFB_IMAGE:-cfb-forecast:local}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    volumes:
      - ${CFB_DATA_DIR:-./data}:/app/data
      - ${CFB_ARTIFACTS_DIR:-./artifacts}:/app/artifacts

  cfb-api:
    user: "${CFB_UID:-10001}:${CFB_GID:-10001}"
    image: ${CFB_IMAGE:-cfb-forecast:local}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CFB_DATA_DIR: /app/data
      CFB_ARTIFACTS_DIR: /app/artifacts
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    ports:
      - "${CFB_API_PORT:-8080}:8080"
    volumes:
      - ${CFB_DATA_DIR:-./data}:/app/data:ro
      - ${CFB_ARTIFACTS_DIR:-./artifacts}:/app/artifacts:ro
    command: ["serve", "--host", "0.0.0.0", "--port", "8080", "--data", "/app/data", "--artifacts", "/app/artifacts"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cfb-dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    image: ${CFB_DASHBOARD_IMAGE:-cfb-forecast-dashboard:local}
    ports:
      - "${CFB_DASHBOARD_PORT:-8501}:8501"
    volumes:
      - ${CFB_ARTIFACTS_DIR:-./artifacts}:/app/artifacts:ro
      - ${CFB_DATA_DIR:-./data}:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: ["streamlit", "run", "dashboard/app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.fileWatcherType=none", "--browser.gatherUsageStats=false"]
