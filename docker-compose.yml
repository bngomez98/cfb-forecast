# CFB forecast stack.
#
#   docker compose up -d                           # scheduler (automation) + dashboard on http://localhost:8501
#   docker compose run --rm pipeline               # the ongoing daily forecast pipeline
#   docker compose run --rm sources                # collect external sites only
#   docker compose run --rm cfb-forecast backtest  # any engine subcommand
#   docker compose run --rm -v ./src:/app/src cfb-forecast ...   # run local source edits without rebuilding
#   docker compose --profile public up -d          # dashboard behind Caddy with automatic HTTPS
#
# Defaults are listed in .env.example; copy it to .env to override them.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-engine: &engine
  image: ${CFB_IMAGE:-cfb-forecast:local}
  build:
    context: .
    dockerfile: Dockerfile
  # Run as the host user so files written to the bind mounts stay editable.
  user: "${CFB_UID:-1000}:${CFB_GID:-1000}"
  logging: *logging
  environment:
    HOME: /tmp
    CFB_DATA_DIR: /app/data
    CFB_ARTIFACTS_DIR: /app/artifacts
    CFB_FORECAST_SEASON: ${CFB_FORECAST_SEASON:-2026}
    CFB_FORECAST_DRAWS: ${CFB_FORECAST_DRAWS:-50000}
    CFB_BACKTEST_LEAD_HOURS: ${CFB_BACKTEST_LEAD_HOURS:-48}
    CFB_REFRESH_DATA: ${CFB_REFRESH_DATA:-1}
    CFB_KEEP_FORECASTS: ${CFB_KEEP_FORECASTS:-14}
    CFB_SOURCES: ${CFB_SOURCES:-all}
    CFB_LOG_LEVEL: ${CFB_LOG_LEVEL:-INFO}
    CFB_LOG_DIR: /app/artifacts/logs
  volumes:
    - ${CFB_DATA_DIR:-./data}:/app/data
    - ${CFB_ARTIFACTS_DIR:-./artifacts}:/app/artifacts

services:
  cfb-forecast:
    <<: *engine
    profiles: [cli]
    command: ["--help"]

  pipeline:
    <<: *engine
    profiles: [cli]
    command: ["pipeline", "forecast"]

  sources:
    <<: *engine
    profiles: [cli]
    command: ["pipeline", "sources"]

  # Automation: the ongoing daily forecast pipeline and a weekly backtest,
  # scheduled from the game calendar (see src/cfb_forecast/scheduler.py).
  scheduler:
    <<: *engine
    restart: unless-stopped
    command: ["scheduler"]
    environment:
      HOME: /tmp
      CFB_DATA_DIR: /app/data
      CFB_ARTIFACTS_DIR: /app/artifacts
      CFB_FORECAST_SEASON: ${CFB_FORECAST_SEASON:-2026}
      CFB_FORECAST_DRAWS: ${CFB_FORECAST_DRAWS:-50000}
      CFB_BACKTEST_LEAD_HOURS: ${CFB_BACKTEST_LEAD_HOURS:-48}
      CFB_SOURCES: ${CFB_SOURCES:-all}
      CFB_LOG_LEVEL: ${CFB_LOG_LEVEL:-INFO}
      CFB_LOG_DIR: /app/artifacts/logs
      CFB_FORECAST_HOURS: ${CFB_FORECAST_HOURS:-24}
      CFB_FORECAST_HOUR: ${CFB_FORECAST_HOUR:-9}
      CFB_BACKTEST_DAY: ${CFB_BACKTEST_DAY:-tue}
      CFB_BACKTEST_HOUR: ${CFB_BACKTEST_HOUR:-11}
      CFB_KEEP_FORECASTS: ${CFB_KEEP_FORECASTS:-14}
    healthcheck:
      test: ["CMD", "cfb-forecast", "healthcheck", "--artifacts", "/app/artifacts", "--max-age", "600"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  dashboard:
    image: ${CFB_DASHBOARD_IMAGE:-cfb-forecast-dashboard:local}
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    restart: unless-stopped
    logging: *logging
    environment:
      CFB_DATA_DIR: /app/data
      CFB_ARTIFACTS_DIR: /app/artifacts
    ports:
      - "${CFB_DASHBOARD_PORT:-8501}:8501"
    volumes:
      - ${CFB_ARTIFACTS_DIR:-./artifacts}:/app/artifacts:ro
      - ${CFB_DATA_DIR:-./data}:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    profiles: [public]
    restart: unless-stopped
    logging: *logging
    environment:
      CFB_DOMAIN: ${CFB_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      dashboard:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
