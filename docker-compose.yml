services:
  cfb-forecast:
    image: ${CFB_IMAGE:-cfb-forecast:local}
    build:
      context: .
      dockerfile: Dockerfile
    user: "${CFB_UID:-10001}:${CFB_GID:-10001}"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    volumes:
      - ${CFB_DATA_DIR:-./data}:/app/data
      - ${CFB_ARTIFACTS_DIR:-./artifacts}:/app/artifacts

  cfb-data-watchdog:
    image: ${CFB_IMAGE:-cfb-forecast:local}
    user: "${CFB_UID:-10001}:${CFB_GID:-10001}"
    command: ["cfb-data-watchdog", "--data", "/app/data", "--database", "/app/artifacts/cfb_forecast.sqlite", "--watch"]
    volumes:
      - ${CFB_DATA_DIR:-./data}:/app/data:ro
      - ${CFB_ARTIFACTS_DIR:-./artifacts}:/app/artifacts

  cfb-dashboard:
    image: ${CFB_DASHBOARD_IMAGE:-cfb-forecast-dashboard:local}
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    user: "${CFB_DASHBOARD_UID:-10002}:${CFB_DASHBOARD_GID:-10002}"
    ports:
      - "${CFB_DASHBOARD_PORT:-8501}:8501"
    volumes:
      - ${CFB_ARTIFACTS_DIR:-./artifacts}:/app/artifacts:ro
      - ${CFB_DATA_DIR:-./data}:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: ["streamlit", "run", "dashboard/app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.fileWatcherType=none", "--browser.gatherUsageStats=false"]
