services:
  cfb-forecast:
    image: ${CFB_IMAGE:-cfb-forecast:local}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    volumes:
      - ${CFB_DATA_DIR:-./data}:/app/data
      - ${CFB_ARTIFACTS_DIR:-./artifacts}:/app/artifacts
  cfb-dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    image: ${CFB_DASHBOARD_IMAGE:-cfb-forecast-dashboard:local}
    ports:
      - "${CFB_DASHBOARD_PORT:-8501}:8501"
    volumes:
      - ${CFB_ARTIFACTS_DIR:-./artifacts}:/app/artifacts:ro
      - ${CFB_DATA_DIR:-./data}:/app/data:ro
    depends_on:
      cfb-forecast:
        condition: service_completed_successfully
    command: ["streamlit", "run", "dashboard/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
