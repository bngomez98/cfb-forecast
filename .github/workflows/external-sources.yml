name: Weekly external CFB sources

on:
  schedule:
    - cron: '30 14 * * 0'
  workflow_dispatch:
    inputs:
      season:
        description: FBS season
        default: '2026'
        required: true

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEASON: ${{ inputs.season || '2026' }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[test]'
      - name: Restore runtime data when available
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: cfb-runtime-${{ env.SEASON }}
          path: runtime
      - name: Ensure source data exists
        run: |
          DATA=runtime/data
          mkdir -p "$DATA"
          if ! ls "$DATA"/schedule_*.csv >/dev/null 2>&1; then
            python -m cfb_forecast fetch --data "$DATA" --seasons "$SEASON"
          fi
      - name: Collect independent sources and weekly validation
        run: |
          python -m cfb_forecast.external_cli \
            --data runtime/data \
            --artifacts runtime/external-sources \
            --season "$SEASON"
      - name: Upload source receipts and validation
        uses: actions/upload-artifact@v4
        with:
          name: cfb-external-sources-${{ env.SEASON }}
          path: runtime/external-sources/
          retention-days: 90
          if-no-files-found: error
