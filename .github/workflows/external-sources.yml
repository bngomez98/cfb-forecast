name: Weekly external CFB sources

on:
  schedule:
    - cron: '30 14 * * 0'
  workflow_dispatch:
    inputs:
      season:
        description: FBS season
        default: '2026'
        required: true

permissions:
  contents: read
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEASON: ${{ inputs.season || '2026' }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: python -m pip install -c requirements-tested.txt -e '.[test]'
      # download-artifact only sees artifacts from this same run, so it could never
      # find the Sunday forecast's saved data. Fetch the newest one through the API.
      - name: Restore runtime data from the latest Sunday run
        run: |
          mkdir -p runtime
          ARTIFACT_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=cfb-runtime-$SEASON&per_page=20" --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')
          if [ -n "$ARTIFACT_ID" ]; then
            echo "Restoring artifact $ARTIFACT_ID"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/cfb-runtime.zip"
            unzip -q "$RUNNER_TEMP/cfb-runtime.zip" -d runtime
          else
            echo "No saved cfb-runtime-$SEASON artifact found; downloading sources fresh."
          fi
      - name: Ensure source data exists
        run: |
          DATA=runtime/data
          mkdir -p "$DATA"
          if ! ls "$DATA"/schedule_*.csv >/dev/null 2>&1; then
            python -m cfb_forecast fetch --data "$DATA" --seasons "$SEASON"
          fi
      - name: Collect independent sources and weekly validation
        run: |
          python -m cfb_forecast.external_cli \
            --data runtime/data \
            --artifacts runtime/external-sources \
            --season "$SEASON"
      - name: Upload source receipts and validation
        uses: actions/upload-artifact@v4
        with:
          name: cfb-external-sources-${{ env.SEASON }}
          path: runtime/external-sources/
          retention-days: 90
          if-no-files-found: error
