name: cfb-forecast

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/bake-action@v6
        with:
          files: ./docker-bake.hcl
          targets: cfb-forecast
          load: true
          push: ${{ github.event_name != 'pull_request' }}
          set: |
            *.args.REGISTRY_IMAGE=${{ env.IMAGE_NAME }}
            *.args.IMAGE_TAG=${{ steps.meta.outputs.version }}
            *.args.PUSH=${{ github.event_name != 'pull_request' }}
            *.labels=${{ steps.meta.outputs.labels }}

      - name: Run weekly forecast
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          FORECAST_SEASON: ${{ vars.CFB_FORECAST_SEASON || '2026' }}
          FORECAST_DRAWS: ${{ vars.CFB_FORECAST_DRAWS || '50000' }}
        run: |
          docker run --rm \
            -v "$PWD/data:/app/data" \
            -v "$PWD/artifacts:/app/artifacts" \
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} weekly-forecast \
            --season "$FORECAST_SEASON" \
            --draws "$FORECAST_DRAWS"

      - name: Upload weekly forecast
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: weekly-forecast
          path: artifacts/latest-weekly/
