name: cfb-forecast

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # docker-bake.hcl reads these variables from the environment.
      REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
      PUSH_IMAGES: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr

      - name: Build forecast and dashboard images
        uses: docker/bake-action@v6
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.version }}
        with:
          source: .
          files: ./docker-bake.hcl
          targets: default
          load: true

      - name: Check the forecast image runs its command line
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.version }}
        run: |
          docker run --rm "$REGISTRY_IMAGE:$IMAGE_TAG" --help
          docker run --rm --entrypoint cfb-data-watchdog "$REGISTRY_IMAGE:$IMAGE_TAG" --help
          docker run --rm --entrypoint python "$REGISTRY_IMAGE:$IMAGE_TAG" -c "import fastapi, uvicorn, cfb_forecast.api"

      - name: Check the dashboard image can load the app's imports
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.version }}
        run: |
          docker run --rm "$REGISTRY_IMAGE-dashboard:$IMAGE_TAG" \
            sh -c 'cd dashboard && python -c "import streamlit, desk; from cfb_forecast.storage.database import connect"'

      - name: Log in to GitHub Container Registry
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push both images
        if: env.PUSH_IMAGES == 'true'
        uses: docker/bake-action@v6
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.version }}
        with:
          source: .
          files: ./docker-bake.hcl
          targets: default
          push: true
