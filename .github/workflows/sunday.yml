name: Sunday FBS forecasts

on:
  schedule:
    # 10 AM America/Chicago across DST. The service ignores the other UTC hour.
    - cron: '0 15,16 * * 0'
  workflow_dispatch:
    inputs:
      season:
        description: FBS season
        default: '2026'
        required: true

concurrency:
  group: sunday-fbs-${{ inputs.season || '2026' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SEASON: ${{ inputs.season || '2026' }}
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      CFB_REQUIRE_R: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-tested.txt
      - name: Check Sunday execution hour
        id: schedule
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os
          now = datetime.now(ZoneInfo("America/Chicago"))
          run = os.environ["GITHUB_EVENT_NAME"] != "schedule" or (now.weekday() == 6 and now.hour == 10)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"run={'true' if run else 'false'}\n")
          PY
      - name: Install and test
        if: steps.schedule.outputs.run == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends r-base-core
          # Same library versions the "tested versions" CI job checks, so a new
          # upstream release can't change Sunday's numbers without being tested first.
          python -m pip install -c requirements-tested.txt -e '.[test]'
          python -m pip check
          python -m pytest -q
      - name: Restore previous predictions, model, and downloaded sources
        if: steps.schedule.outputs.run == 'true'
        run: |
          mkdir -p runtime
          # Ask for this artifact by name, newest first, so other uploads can't push it off the first page.
          ARTIFACT_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=cfb-runtime-$SEASON&per_page=20" --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')
          if [ -n "$ARTIFACT_ID" ]; then
            echo "Restoring artifact $ARTIFACT_ID"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/cfb-runtime.zip"
            unzip -q "$RUNNER_TEMP/cfb-runtime.zip" -d runtime
          else
            echo "::warning::No saved cfb-runtime-$SEASON artifact found; starting without last week's predictions."
          fi
      - name: Collect inputs, validate last week, and calculate this week
        if: steps.schedule.outputs.run == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = schedule ]; then
            python -m cfb_forecast sunday-run --data runtime/data --artifacts runtime/artifacts --season "$SEASON" --scheduled
          else
            python -m cfb_forecast sunday-run --data runtime/data --artifacts runtime/artifacts --season "$SEASON"
          fi
      - name: Write a run summary to the Actions page
        if: always() && steps.schedule.outputs.run == 'true'
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("runtime/artifacts/latest/run_manifest.json")
          lines = [f"## Sunday FBS forecast, season {os.environ['SEASON']}", ""]
          if not path.exists():
              lines.append("No run manifest was written. Check the step logs above for the error.")
          else:
              receipt = json.loads(path.read_text())
              for key in ("status", "run_id", "as_of", "games", "price_rows", "slate_start", "slate_end"):
                  if key in receipt:
                      lines.append(f"- **{key}**: {receipt[key]}")
              for key in ("learning", "distribution"):
                  part = receipt.get(key)
                  if isinstance(part, dict):
                      detail = part.get("message") or part.get("reason") or ""
                      lines.append(f"- **{key}**: {part.get('status', 'unknown')} {detail}".rstrip())
              validation = receipt.get("validation")
              reports = validation if isinstance(validation, list) else [validation] if isinstance(validation, dict) else []
              for report in reports:
                  scalars = {k: v for k, v in report.items() if isinstance(v, (int, float, str))}
                  if scalars:
                      lines.append("- **validation**: " + ", ".join(f"{k} {v}" for k, v in scalars.items()))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("\n".join(lines) + "\n")
          PY
      - name: Save runtime for next Sunday's validation
        if: always() && steps.schedule.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cfb-runtime-${{ env.SEASON }}
          path: runtime/
          retention-days: 90
          include-hidden-files: false
          if-no-files-found: error
      - name: Publish forecast and validation report as downloadable artifacts
        if: success() && steps.schedule.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cfb-desk-${{ env.SEASON }}
          path: runtime/artifacts/latest/
          retention-days: 90
