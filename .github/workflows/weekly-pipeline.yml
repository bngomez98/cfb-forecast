name: weekly-pipeline

on:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:
    inputs:
      season:
        description: "Season"
        required: true
        default: "2026"
      draws:
        description: "Simulation draws"
        required: true
        default: "50000"

jobs:
  weekly-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/${{ github.repository }}:main
      SEASON: ${{ inputs.season || vars.CFB_FORECAST_SEASON || '2026' }}
      DRAWS: ${{ inputs.draws || vars.CFB_FORECAST_DRAWS || '50000' }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull forecast image
        run: docker pull "$IMAGE"
      - name: Run Python pipeline
        env:
          CFB_FORECAST_SEASON: ${{ env.SEASON }}
          CFB_FORECAST_DRAWS: ${{ env.DRAWS }}
          CFB_IMAGE: ${{ env.IMAGE }}
        run: python -m scripts.cfb weekly --season "$SEASON" --draws "$DRAWS"
      - name: Upload integrated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cfb-pipeline-${{ env.SEASON }}
          path: |
            artifacts/latest-weekly/
            artifacts/results/
            artifacts/backtest/season-${{ env.SEASON }}/
