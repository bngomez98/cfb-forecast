name: live-results

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  SEASON: ${{ vars.CFB_FORECAST_SEASON || '2026' }}

jobs:
  refresh-results:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refresh ESPN results
        run: |
          docker pull "${IMAGE_NAME}:main"
          mkdir -p artifacts/results
          docker run --rm \
            -v "$PWD/data:/app/data:ro" \
            -v "$PWD/artifacts:/app/artifacts" \
            "${IMAGE_NAME}:main" results-refresh \
            --season "$SEASON" \
            --out /app/artifacts/results

      - name: Upload result snapshot
        uses: actions/upload-artifact@v4
        with:
          name: live-results
          path: artifacts/results/
