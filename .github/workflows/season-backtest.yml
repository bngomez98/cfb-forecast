name: season-backtest

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season to backtest"
        required: true
        default: "2026"
      draws:
        description: "Simulation draws per game"
        required: true
        default: "50000"
      lead_hours:
        description: "Hours before kickoff used as forecast cutoff"
        required: true
        default: "48"

jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run season backtest
        env:
          IMAGE: ghcr.io/${{ github.repository }}:main
          SEASON: ${{ inputs.season }}
          DRAWS: ${{ inputs.draws }}
          LEAD_HOURS: ${{ inputs.lead_hours }}
        run: |
          docker pull "$IMAGE"
          mkdir -p artifacts/backtest
          docker run --rm \
            -v "$PWD/data:/app/data:ro" \
            -v "$PWD/artifacts:/app/artifacts" \
            "$IMAGE" season-backtest \
            --season "$SEASON" \
            --draws "$DRAWS" \
            --lead-hours "$LEAD_HOURS"

      - name: Upload backtest report
        uses: actions/upload-artifact@v4
        with:
          name: season-backtest-${{ inputs.season }}
          path: artifacts/backtest/season-${{ inputs.season }}/
