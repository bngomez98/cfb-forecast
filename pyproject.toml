[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfb-forecast"
version = "0.4.0"
description = "Real-data Sunday FBS forecasts, betting diagnostics, and weekly validation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2,<3", "scipy>=1.12", "scikit-learn>=1.4", "pyarrow>=15,<26"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "fastapi>=0.115"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
cfb-forecast = "cfb_forecast.cli:main"
cfb-pipeline = "cfb_forecast.pipeline_cli:main"
cfb-data-watchdog = "cfb_forecast.data_watchdog:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--basetemp=.pytest_tmp"]
