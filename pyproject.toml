[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfb-forecast"
version = "0.4.0"
description = "Real-data FBS forecasts: Sunday slates, daily updates, betting diagnostics and weekly validation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "bngomez98" }]
keywords = ["college-football", "forecasting", "kalman-filter", "sports-analytics", "backtesting"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2,<3",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "pyarrow>=15,<26",
    "pypdf>=4",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "fastapi>=0.115"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
dashboard = ["streamlit>=1.40,<2"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.115", "uvicorn>=0.30", "ruff>=0.6", "build>=1.2", "streamlit>=1.40,<2"]

[project.scripts]
cfb-forecast = "cfb_forecast.cli:main"
cfb-data-watchdog = "cfb_forecast.data_watchdog:main"

[project.urls]
Homepage = "https://github.com/bngomez98/cfb-forecast"
Source = "https://github.com/bngomez98/cfb-forecast"
Issues = "https://github.com/bngomez98/cfb-forecast/issues"

[tool.setuptools.package-data]
cfb_forecast = ["*.R"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--basetemp=.pytest_tmp"]

[tool.ruff]
target-version = "py311"
line-length = 160
src = ["src", "tests", "dashboard"]
extend-exclude = ["artifacts", "data", "web"]

[tool.ruff.lint]
# Pyflakes plus syntax/runtime errors. The engine uses a compact one-line style,
# so multiple-statement and spacing rules are intentionally not enforced.
select = ["E9", "F"]
