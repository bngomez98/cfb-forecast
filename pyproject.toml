[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfb-forecast"
version = "0.3.1"
description = "Reproducible college football forecasting and chronological evaluation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.12", "scikit-learn>=1.4", "pyarrow>=15"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cfb-forecast = "cfb_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
