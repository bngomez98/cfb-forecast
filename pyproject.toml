[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfb-forecast"
version = "0.3.1"
description = "Reproducible college football forecasting and chronological evaluation"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "statsforecast>=1.7",
    "matplotlib>=3.8",
    "pyarrow>=15",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
app = ["streamlit>=1.35"]
test = ["pytest>=8,<9"]

[project.scripts]
cfb-forecast = "cfb_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["artifacts", "data"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long: handled selectively; some wide math expressions are intentional
    "B008",  # function call in default argument: pandas Timedelta/Timestamp accept this
]

[tool.ruff.lint.per-file-ignores]
# The whole tree now passes the selected rules without exemptions: the
# chained-semicolon cleanup pass is complete and ruff format normalizes line
# length, so E501 stays ignored only as a guard for intentional wide math.
"tests/*" = ["E402", "B905"]
