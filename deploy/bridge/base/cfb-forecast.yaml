apiVersion: v1
kind: Namespace
metadata:
  name: cfb-forecast
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cfb-forecast
  namespace: cfb-forecast
  labels:
    app.kubernetes.io/name: cfb-forecast
    app.kubernetes.io/component: forecast
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cfb-forecast
      app.kubernetes.io/component: forecast
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cfb-forecast
        app.kubernetes.io/component: forecast
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: cfb-forecast
          image: cfb-forecast:local
          imagePullPolicy: IfNotPresent
          args: ["--help"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: OPENBLAS_NUM_THREADS
              value: "1"
            - name: OMP_NUM_THREADS
              value: "1"
            - name: MKL_NUM_THREADS
              value: "1"
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: artifacts
              mountPath: /app/artifacts
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cfb-forecast-data
        - name: artifacts
          persistentVolumeClaim:
            claimName: cfb-forecast-artifacts
---
apiVersion: v1
kind: Service
metadata:
  name: cfb-forecast
  namespace: cfb-forecast
spec:
  selector:
    app.kubernetes.io/name: cfb-forecast
    app.kubernetes.io/component: forecast
  ports:
    - name: forecast
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cfb-dashboard
  namespace: cfb-forecast
  labels:
    app.kubernetes.io/name: cfb-forecast
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cfb-forecast
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cfb-forecast
        app.kubernetes.io/component: dashboard
    spec:
      securityContext:
        runAsUser: 10002
        runAsGroup: 10002
        fsGroup: 10002
      containers:
        - name: cfb-dashboard
          image: cfb-forecast-dashboard:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8501
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /app/data
              readOnly: true
            - name: artifacts
              mountPath: /app/artifacts
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cfb-forecast-data
        - name: artifacts
          persistentVolumeClaim:
            claimName: cfb-forecast-artifacts
---
apiVersion: v1
kind: Service
metadata:
  name: cfb-dashboard
  namespace: cfb-forecast
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cfb-forecast
    app.kubernetes.io/component: dashboard
  ports:
    - name: http
      port: 8501
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cfb-forecast-data
  namespace: cfb-forecast
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cfb-forecast-artifacts
  namespace: cfb-forecast
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
